<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>같이보기 · Sync Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.google.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-0:#080a14;
    --bg-1:#0f1326;
    --bg-2:#161b34;
    --line:#242a4a;
    --text-hi:#eef0ff;
    --text-lo:#8890b5;
    --accent-a:#7ef7e6;   /* cyan glow */
    --accent-b:#9b8cff;   /* violet glow */
    --accent-grad: linear-gradient(120deg, var(--accent-a), var(--accent-b));
    --danger:#ff6b81;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(155,140,255,0.16), transparent),
      radial-gradient(ellipse 60% 40% at 90% 100%, rgba(126,247,230,0.08), transparent),
      var(--bg-0);
    color:var(--text-hi);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}

  /* ---------- landing ---------- */
  #landing{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px 32px;
    backdrop-filter:blur(10px);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:-40%; left:-20%;
    width:180px; height:180px;
    background:var(--accent-grad);
    filter:blur(70px);
    opacity:0.35;
    pointer-events:none;
  }
  .eyebrow{
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--accent-a); margin-bottom:10px; font-weight:500;
  }
  h1.display{
    font-size:28px; font-weight:600; line-height:1.25; margin-bottom:6px;
  }
  .sub{color:var(--text-lo); font-size:14px; margin-bottom:28px; line-height:1.5;}
  label{
    display:block; font-size:12px; color:var(--text-lo); margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .field{margin-bottom:18px;}
  input[type=text], input[type=password]{
    width:100%;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-hi);
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter', sans-serif;
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, input[type=password]:focus{border-color:var(--accent-a);}
  input[type=text]::placeholder, input[type=password]::placeholder{color:#565d80;}
  .tabs{display:flex; gap:6px; margin-bottom:20px; background:var(--bg-1); padding:4px; border-radius:10px; border:1px solid var(--line);}
  .tab{
    flex:1; text-align:center; padding:9px 0; border-radius:8px; font-size:13px;
    color:var(--text-lo); cursor:pointer; user-select:none; font-weight:500;
    transition:all .15s;
  }
  .tab.active{background:var(--bg-2); color:var(--text-hi);}
  .btn{
    width:100%;
    background:var(--accent-grad);
    color:#0a0d1c;
    border:none;
    padding:13px 0;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    letter-spacing:0.01em;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--text-lo); margin-top:12px; line-height:1.5;}
  .err{color:var(--danger); font-size:12px; margin-top:8px; min-height:16px;}
  .err.show{animation:err-shake .32s ease;}
  @keyframes err-shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  input.invalid{border-color:var(--danger) !important; box-shadow:0 0 0 2px rgba(255,107,129,0.15);}
  .hidden{display:none !important;}

  /* ---------- room ---------- */
  #room{min-height:100vh; display:none; flex-direction:column;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:rgba(15,19,38,0.7); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent-grad);
    box-shadow:0 0 12px var(--accent-a);
  }
  .brand-name{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px;}
  .room-code{
    font-size:11px; color:var(--text-lo); margin-left:8px;
    padding:3px 8px; border:1px solid var(--line); border-radius:6px;
  }
  .pulse-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-lo);}
  .pulse{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent-a);
    position:relative;
  }
  .pulse::after{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    border:1px solid var(--accent-a);
    animation:pulse-ring 1.8s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(0.6); opacity:0.9;}
    100%{transform:scale(2.4); opacity:0;}
  }
  .leave{
    font-size:12px; color:var(--text-lo); cursor:pointer; border:1px solid var(--line);
    padding:6px 12px; border-radius:8px; background:transparent;
  }
  .leave:hover{color:var(--text-hi); border-color:var(--accent-a);}

  main{
    flex:1; display:flex; gap:0; max-width:1400px; margin:0 auto; width:100%;
    padding:20px; align-items:flex-start;
  }
  .player-col{flex:1; min-width:0;}
  .player-frame{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(126,247,230,0.05), 0 20px 60px rgba(0,0,0,0.5);
  }
  .unmute-btn{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(8,10,20,0.85); border:1px solid var(--accent-a); color:var(--text-hi);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer;
    backdrop-filter:blur(6px); z-index:5; font-family:'Inter';
    box-shadow:0 0 20px rgba(126,247,230,0.15);
  }
  .unmute-btn:hover{background:rgba(8,10,20,0.95);}
  #player{width:100%; height:100%;}
  .waveline{
    height:3px; border-radius:3px; margin-top:14px;
    background:var(--bg-2); overflow:hidden; position:relative;
  }
  .waveline-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--accent-grad);
    transition:width .3s linear;
  }
  .video-meta{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .video-title{font-size:13px; color:var(--text-lo);}
  .host-controls{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .host-controls button{
    background:var(--bg-1); border:1px solid var(--line); color:var(--text-hi);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'Inter';
  }
  .host-controls button:hover{border-color:var(--accent-a);}
  .host-controls input{
    flex:1; min-width:180px; background:var(--bg-1); border:1px solid var(--line);
    color:var(--text-hi); padding:8px 12px; border-radius:8px; font-size:12px;
  }
  .badge{
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; font-weight:600;
  }
  .badge-host{background:rgba(126,247,230,0.15); color:var(--accent-a);}
  .badge-viewer{background:rgba(255,255,255,0.06); color:var(--text-lo);}

  /* danger (host end-room) button */
  .btn-danger{
    background:rgba(255,107,129,0.12) !important; border-color:rgba(255,107,129,0.4) !important;
    color:var(--danger) !important;
  }
  .btn-danger:hover{border-color:var(--danger) !important; background:rgba(255,107,129,0.2) !important;}

  /* ---------- reactions ---------- */
  .reaction-overlay{
    position:absolute; left:0; right:0; bottom:0; height:70%;
    pointer-events:none; overflow:hidden; z-index:4;
  }
  .reaction-emoji{
    position:absolute; bottom:6px; font-size:22px; opacity:0.85;
    animation:reaction-float 2.6s ease-out forwards;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  @keyframes reaction-float{
    0%{transform:translateY(0) scale(0.6); opacity:0;}
    12%{opacity:0.9; transform:translateY(-10px) scale(1);}
    100%{transform:translateY(-190px) scale(1.05) translateX(var(--drift,0px)); opacity:0;}
  }
  .reaction-bar{
    position:absolute; right:10px; bottom:10px; z-index:6;
    display:flex; align-items:center; gap:5px;
    background:rgba(8,10,20,0.55); backdrop-filter:blur(6px);
    padding:6px 7px; border-radius:999px; border:1px solid rgba(255,255,255,0.08);
    transition:opacity .2s;
  }
  .reaction-buttons{display:flex; align-items:center; gap:5px;}
  .reaction-bar.collapsed .reaction-buttons{display:none;}
  .reaction-collapse-btn{
    background:none; border:none; font-size:16px; cursor:pointer;
    line-height:1; padding:4px; border-radius:50%; transition:transform .1s, background .15s;
  }
  .reaction-collapse-btn:hover{background:rgba(255,255,255,0.08); transform:scale(1.1);}
  .reaction-bar button{
    background:none; border:none; font-size:16px; cursor:pointer;
    line-height:1; padding:4px; border-radius:50%; transition:transform .1s, background .15s;
  }
  .reaction-bar button:hover{background:rgba(255,255,255,0.08); transform:scale(1.15);}
  .reaction-toggle-btn{
    font-size:13px !important; opacity:0.7; border-left:1px solid rgba(255,255,255,0.12);
    margin-left:2px; padding-left:8px !important;
  }
  .reaction-toggle-btn.muted{opacity:0.4;}

  /* ---------- user list panel ---------- */
  .online-toggle{
    background:none; border:none; color:var(--text-lo); font-size:12px; cursor:pointer;
    font-family:'Inter', sans-serif; display:flex; align-items:center; gap:3px;
    padding:2px 4px; border-radius:6px;
  }
  .online-toggle:hover{color:var(--text-hi);}
  .user-list-panel{
    position:absolute; top:44px; right:14px; width:200px; max-height:260px;
    background:var(--bg-2); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.45); z-index:20; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .user-list-title{
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-lo);
    padding:10px 12px; border-bottom:1px solid var(--line);
  }
  .user-list-items{list-style:none; overflow-y:auto; padding:6px;}
  .user-list-items li{
    display:flex; align-items:center; gap:7px; padding:7px 8px; border-radius:8px; font-size:13px;
  }
  .user-list-items li:hover{background:rgba(255,255,255,0.04);}
  .user-list-items .dot{width:6px; height:6px; border-radius:50%; background:var(--accent-a); flex-shrink:0;}
  .user-list-items .host-tag{
    font-size:9px; color:var(--accent-a); border:1px solid var(--accent-a); border-radius:4px;
    padding:1px 4px; margin-left:auto; letter-spacing:0.03em;
  }

  /* ---------- room closing overlay ---------- */
  .closing-overlay{
    position:fixed; inset:0; background:rgba(5,6,14,0.94); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:999; text-align:center; padding:24px;
  }
  .closing-overlay.show{display:flex;}
  .closing-box{max-width:380px;}
  .closing-box .icon{font-size:34px; margin-bottom:14px;}
  .closing-box h2{font-family:'Space Grotesk', sans-serif; font-size:20px; margin-bottom:10px;}
  .closing-box p{color:var(--text-lo); font-size:13.5px; line-height:1.6; margin-bottom:22px;}
  .closing-box .count{
    font-family:'JetBrains Mono', monospace; font-size:38px; color:var(--accent-a);
    margin-bottom:22px; letter-spacing:0.02em;
  }

  /* chat */
  .chat-col{
    width:340px; flex-shrink:0; margin-left:20px;
    display:flex; flex-direction:column;
    height:calc(100vh - 108px); position:sticky; top:88px;
    background:var(--bg-1); border:1px solid var(--line); border-radius:14px;
    overflow:hidden;
  }
  .chat-head{
    padding:14px 16px; border-bottom:1px solid var(--line);
    font-size:12px; color:var(--text-lo); display:flex; justify-content:space-between;
  }
  .chat-log{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
  .chat-log::-webkit-scrollbar{width:5px;}
  .chat-log::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .msg{animation:rise .25s ease-out;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg .who{font-size:11px; font-weight:600; margin-bottom:2px;}
  .msg .body-text{font-size:13.5px; line-height:1.45; color:#dadeff; word-break:break-word;}
  .msg.me .who{color:var(--accent-a);}
  .msg.sys{opacity:0.55; font-size:11.5px; font-style:italic;}
  .chat-input-row{
    display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);
  }
  .chat-input-row input{
    flex:1; background:var(--bg-0); border:1px solid var(--line); color:var(--text-hi);
    padding:10px 12px; border-radius:9px; font-size:13px; outline:none;
  }
  .chat-input-row input:focus{border-color:var(--accent-a);}
  .send-btn{
    background:var(--accent-grad); border:none; color:#0a0d1c; font-weight:600;
    padding:0 16px; border-radius:9px; cursor:pointer; font-size:13px;
  }

  @media (max-width: 880px){
    html, body{height:100%;}
    #room{height:100vh; height:100dvh; overflow:hidden;}
    main{
      flex-direction:column; padding:12px; gap:0;
      overflow:hidden; min-height:0;
    }
    .player-col{flex-shrink:0;}
    .chat-col{
      width:100%; flex:1; min-height:0;
      margin-left:0; margin-top:12px; position:relative; top:0; height:auto;
    }
    .chat-log{flex:1; min-height:0;}
  }

  /* ---------- fullscreen split view ---------- */
  main:fullscreen, main:-webkit-full-screen{
    max-width:none; width:100vw; height:100vh;
    background:var(--bg-0); padding:10px; overflow-y:auto;
  }
  main:fullscreen .chat-col, main:-webkit-full-screen .chat-col{
    height:calc(100vh - 20px); top:0; width:300px; margin-left:14px;
  }
  main:fullscreen .player-frame, main:-webkit-full-screen .player-frame{
    max-height:calc(100vh - 20px);
  }
  @media (max-width: 880px){
    main:fullscreen, main:-webkit-full-screen{
      padding:8px;
    }
    main:fullscreen .chat-col, main:-webkit-full-screen .chat-col{
      width:100%; margin-left:0; height:auto; flex:1;
    }
  }
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<div id="landing">
  <div class="card">
    <div class="eyebrow">PLLI · SYNC WATCH</div>
    <h1 class="display">플리들과 같이보기</h1>
    <p class="sub">유튜브 라이브 다시보기를 함께 재생하고, 실시간으로 채팅하며 그날의 감동을 다시 나눠요.</p>

    <div class="tabs">
      <div class="tab" id="tabCreate">호스트로 입장하기</div>
      <div class="tab active" id="tabJoin">방 참여하기</div>
    </div>

    <div class="field">
      <label>닉네임</label>
      <input type="text" id="nickname" placeholder="예: 플리123" maxlength="16">
    </div>

    <div class="hidden" id="createFields">
      <div class="field">
        <label>호스트 비밀번호</label>
        <input type="password" id="hostPassword" placeholder="비밀번호 입력" autocomplete="off">
      </div>
      <div class="field">
        <label>유튜브 영상 URL</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>
    </div>

    <div class="field" id="joinFields">
      <label>방 코드</label>
      <input type="text" id="roomCodeInput" placeholder="예: 5875" class="mono">
    </div>

    <button class="btn" id="enterBtn">입장하기</button>
    <div class="err" id="landingErr"></div>
    <div class="hint" id="landingHint">호스트에게 받은 방 코드를 입력하고 입장하세요. 호스트가 재생을 조작하면 화면이 함께 동기화돼요.</div>
  </div>
</div>

<!-- ============ ROOM ============ -->
<div id="room">
  <header>
    <div class="brand">
      <div class="logo-dot"></div>
      <div class="brand-name display">Sync Watch</div>
      <div class="room-code mono" id="roomCodeLabel">-</div>
    </div>
    <div class="pulse-wrap">
      <div class="pulse"></div>
      <span id="syncStatus">동기화됨</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="leave" id="fullscreenBtn">⛶ 전체화면</button>
      <button class="leave" id="leaveBtn">나가기</button>
    </div>
  </header>

  <main>
    <div class="player-col">
      <div class="player-frame">
        <div id="player"></div>
        <button id="unmuteBtn" class="unmute-btn hidden">🔇 소리 켜기</button>
        <div class="reaction-overlay" id="reactionOverlay"></div>
        <div class="reaction-bar" id="reactionBar">
          <button class="reaction-collapse-btn" id="reactionCollapseBtn" title="이모지 패널 열기/닫기">🎉</button>
          <div class="reaction-buttons" id="reactionButtons">
            <button data-emoji="👍" title="좋아요">👍</button>
            <button data-emoji="❤️" title="사랑해요">❤️</button>
            <button data-emoji="😂" title="웃겨요">😂</button>
            <button data-emoji="😮" title="놀라워요">😮</button>
            <button data-emoji="👏" title="박수">👏</button>
            <button class="reaction-toggle-btn" id="reactionToggleBtn" title="리액션 표시 끄기/켜기">👁️</button>
          </div>
        </div>
      </div>
      <div class="waveline"><div class="waveline-fill" id="waveFill"></div></div>
      <div class="video-meta">
        <div class="video-title" id="videoTitleLabel">영상을 불러오는 중...</div>
        <span class="badge" id="roleBadge">VIEWER</span>
      </div>
      <div class="host-controls hidden" id="hostControls">
        <input type="text" id="newVideoUrl" placeholder="다른 영상 URL 붙여넣기 후 변경">
        <button id="changeVideoBtn">영상 바꾸기</button>
        <button id="resyncBtn">지금 시점으로 전체 동기화</button>
        <button id="endRoomBtn" class="btn-danger">[방종료]</button>
      </div>
    </div>

    <div class="chat-col">
      <div class="chat-head" style="position:relative;">
        <span>실시간 채팅</span>
        <button class="online-toggle mono" id="onlineToggleBtn"><span id="onlineLabel">· 채팅방</span> ▾</button>
        <div class="user-list-panel hidden" id="userListPanel">
          <div class="user-list-title">접속자 목록</div>
          <ul class="user-list-items" id="userListItems"></ul>
        </div>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="메시지 보내기..." maxlength="200">
        <button class="send-btn" id="sendBtn">전송</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ ROOM CLOSING OVERLAY ============ -->
<div class="closing-overlay" id="closingOverlay">
  <div class="closing-box">
    <div class="icon">⏳</div>
    <h2 class="display" id="closingTitle">방이 곧 종료됩니다</h2>
    <p id="closingDesc">호스트가 시청방을 종료했어요.</p>
    <div class="count mono" id="closingCount">30</div>
  </div>
</div>

<script>
(function(){
  // ---------- state ----------
  let roomCode = null;
  let nickname = null;
  let isHost = false;
  let player = null;
  let playerReady = false;
  let lastKnownState = null; // {videoId, isPlaying, time, updatedAt}
  let lastChatIds = new Set();
  let stateInterval = null;
  let chatInterval = null;
  let applyingRemoteState = false;
  let stateListenerRef = null;
  let chatListenerRef = null;
  let usersListenerRef = null;
  let myUserKey = null;

  // ---------- firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBc7ovFbsWYO1KTNvbAJERx_SZxs9TC8C4",
    authDomain: "plave-211be.firebaseapp.com",
    databaseURL: "https://plave-211be-default-rtdb.firebaseio.com",
    projectId: "plave-211be",
    storageBucket: "plave-211be.firebasestorage.app",
    messagingSenderId: "902598890285",
    appId: "1:902598890285:web:0ea0814725f92868a5b9a4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  function dbSet(path, value){ return db.ref(path).set(value); }
  function dbGet(path){ return db.ref(path).get().then(snap => snap.exists() ? snap.val() : null); }

  function extractVideoId(raw){
    if(!raw) return null;
    let url = raw.trim();
    if(!url) return null;

    // 유튜브 ID만 딱 붙여넣은 경우 (11자리 영숫자/-/_)
    if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;

    // 프로토콜 없이 붙여넣은 경우 보정
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

    try{
      const u = new URL(url);
      const host = u.hostname.replace(/^www\.|^m\./, '');

      if(host === 'youtu.be'){
        const id = u.pathname.split('/').filter(Boolean)[0];
        return id && id.length === 11 ? id : null;
      }

      if(host === 'youtube.com' || host === 'music.youtube.com'){
        // watch?v=... (v가 어느 위치에 있든 상관없이)
        const v = u.searchParams.get('v');
        if(v && v.length === 11) return v;

        // /embed/ID, /shorts/ID, /live/ID
        const parts = u.pathname.split('/').filter(Boolean);
        const idx = parts.findIndex(p => ['embed','shorts','live'].includes(p));
        if(idx !== -1 && parts[idx+1] && parts[idx+1].length >= 11){
          return parts[idx+1].slice(0,11);
        }
      }
    }catch(e){
      // URL 파싱 자체가 실패하면 마지막 수단으로 정규식 시도
      const m = raw.match(/([A-Za-z0-9_-]{11})(?:[?&#]|$)/);
      if(m) return m[1];
    }
    return null;
  }

  function genRoomCode(){
    const n = Math.floor(1000 + Math.random()*9000);
    return String(n);
  }

  // 닉네임을 Firebase 키로 써도 안전하게 변환 (., #, $, /, [, ] 는 키에 못 쓰므로 인코딩)
  function nickKey(nick){
    return encodeURIComponent(nick).replace(/\./g, '%2E');
  }

  // ---------- landing tabs ----------
  const tabCreate = document.getElementById('tabCreate');
  const tabJoin = document.getElementById('tabJoin');
  const createFields = document.getElementById('createFields');
  const joinFields = document.getElementById('joinFields');
  const landingHint = document.getElementById('landingHint');
  let mode = 'join';

  const CREATE_HINT = '방을 만들면 방 코드가 생성돼요. 그 코드를 플리들에게 공유해서 함께 시청하세요. 호스트 비밀번호가 맞아야 방을 만들 수 있어요.<br><br>호스트인데 새로고침했거나 재접속해야 한다면, 방을 새로 만들지 말고 <b>\'방 참여하기\'</b>에서 같은 코드로 다시 들어오세요. 자동으로 호스트 권한이 복구돼요.';
  const JOIN_HINT = '호스트에게 받은 방 코드를 입력하고 입장하세요. 호스트가 재생을 조작하면 화면이 함께 동기화돼요.';

  tabCreate.onclick = () => {
    mode = 'create';
    tabCreate.classList.add('active'); tabJoin.classList.remove('active');
    createFields.classList.remove('hidden'); joinFields.classList.add('hidden');
    landingHint.innerHTML = CREATE_HINT;
  };
  tabJoin.onclick = () => {
    mode = 'join';
    tabJoin.classList.add('active'); tabCreate.classList.remove('active');
    joinFields.classList.remove('hidden'); createFields.classList.add('hidden');
    landingHint.innerHTML = JOIN_HINT;
  };

  const errEl = document.getElementById('landingErr');
  const nicknameInput = document.getElementById('nickname');
  function showErr(msg, opts){
    errEl.textContent = msg;
    errEl.classList.remove('show');
    if(msg){
      void errEl.offsetWidth; // 리플로우를 강제해서 흔들림 애니메이션을 다시 트리거
      errEl.classList.add('show');
    }
    if(opts && opts.field){
      opts.field.classList.add('invalid');
    }
  }
  function clearFieldErrors(){
    nicknameInput.classList.remove('invalid');
    document.getElementById('videoUrl').classList.remove('invalid');
    document.getElementById('roomCodeInput').classList.remove('invalid');
    document.getElementById('hostPassword').classList.remove('invalid');
  }
  nicknameInput.addEventListener('input', () => nicknameInput.classList.remove('invalid'));

  document.getElementById('enterBtn').onclick = async () => {
    clearFieldErrors();
    const nick = document.getElementById('nickname').value.trim();
    if(!nick){ showErr('닉네임을 입력해주세요.', {field:nicknameInput}); return; }
    if(nick.length > 16){ showErr('닉네임은 16자 이내로 입력해주세요.', {field:nicknameInput}); return; }
    showErr('');
    nickname = nick;
    const key = nickKey(nick);

    if(mode === 'create'){
      const pw = document.getElementById('hostPassword').value;
      if(pw !== 'hari3951!'){ showErr('호스트 비밀번호가 올바르지 않습니다.', {field:document.getElementById('hostPassword')}); return; }
      const url = document.getElementById('videoUrl').value.trim();
      const vid = extractVideoId(url);
      if(!vid){ showErr('올바른 유튜브 URL을 입력해주세요.', {field:document.getElementById('videoUrl')}); return; }
      roomCode = genRoomCode();

      // 아주 드물게 같은 방 코드가 재사용될 수 있으니, 그 방에 동일 닉네임이 이미 있는지도 확인
      try{
        const existing = await dbGet('rooms/'+roomCode+'/users/'+key);
        if(existing){ showErr('중복 닉네임이 있습니다! 다른 닉네임을 입력해주세요.', {field:nicknameInput}); return; }
      }catch(e){}

      isHost = true;
      const initState = { videoId: vid, isPlaying: true, time: 0, updatedAt: Date.now() };
      lastKnownState = initState;
      initialVideoId = vid; // 호스트는 DB를 다시 조회하지 않고 바로 이 값으로 플레이어를 만든다
      try{
        await dbSet('rooms/'+roomCode+'/state', initState);
        await dbSet('rooms/'+roomCode+'/chat', [{
          id:'sys-'+Date.now(), sys:true, text: nickname+'님이 방을 만들었어요. 함께 시청해요!', ts: Date.now()
        }]);
        // 이 브라우저에만 "이 방의 호스트는 나" 라는 표식을 남김 (새로고침 후 재인식용)
        localStorage.setItem('hostof:'+roomCode, '1');
        await registerPresence(roomCode, key);
      }catch(e){ showErr('방 생성에 실패했어요. 다시 시도해주세요.'); return; }
      enterRoom();
    } else {
      const code = document.getElementById('roomCodeInput').value.trim();
      if(!code){ showErr('방 코드를 입력해주세요.', {field:document.getElementById('roomCodeInput')}); return; }
      try{
        const st = await dbGet('rooms/'+code+'/state');
        if(!st){ showErr('존재하지 않는 방 코드예요. 코드를 다시 확인해주세요.', {field:document.getElementById('roomCodeInput')}); return; }

        // 이 방을 이 브라우저에서 만든 적이 있는지(=원래 호스트인지) 먼저 확인
        const wasHost = localStorage.getItem('hostof:'+code) === '1';

        // 호스트 재접속이 아니라면, 같은 방에 동일 닉네임이 이미 있는지 확인
        if(!wasHost){
          const existing = await dbGet('rooms/'+code+'/users/'+key);
          if(existing){ showErr('중복 닉네임이 있습니다! 다른 닉네임을 입력해주세요.', {field:nicknameInput}); return; }
        }

        roomCode = code;
        lastKnownState = st;
        initialVideoId = st.videoId;
        isHost = wasHost;
        await registerPresence(roomCode, key);
        if(isHost){
          await postSystemMessage(nickname + '님(호스트)이 다시 접속했어요.');
        } else {
          await postSystemMessage(nickname + '님이 입장했어요.');
        }
      }catch(e){ showErr('방을 찾을 수 없어요. 코드를 확인해주세요.'); return; }
      enterRoom();
    }
  };

  // 접속자 목록에 내 닉네임을 등록하고, 연결이 끊기면(새로고침/탭닫기/네트워크 끊김) 자동으로 지워지게 예약
  async function registerPresence(code, key){
    myUserKey = key;
    const ref = db.ref('rooms/'+code+'/users/'+key);
    await ref.set({ nick: nickname, ts: Date.now(), host: isHost });
    ref.onDisconnect().remove();
  }

  function startUsersWatch(){
    usersListenerRef = db.ref('rooms/'+roomCode+'/users');
    usersListenerRef.on('value', (snap)=>{
      const val = snap.val() || {};
      const entries = Object.values(val);
      const count = entries.length;
      document.getElementById('onlineLabel').textContent = '· ' + count + '명 접속 중';
      renderUserList(entries);
    });
  }

  // ---------- user list panel ----------
  function renderUserList(entries){
    const list = document.getElementById('userListItems');
    list.innerHTML = '';
    entries
      .slice()
      .sort((a,b)=> (b.host?1:0) - (a.host?1:0) || a.ts - b.ts)
      .forEach(u=>{
        const li = document.createElement('li');
        const dot = document.createElement('span');
        dot.className = 'dot';
        const name = document.createElement('span');
        name.textContent = u.nick || '익명';
        li.appendChild(dot);
        li.appendChild(name);
        if(u.host){
          const tag = document.createElement('span');
          tag.className = 'host-tag';
          tag.textContent = 'HOST';
          li.appendChild(tag);
        }
        list.appendChild(li);
      });
  }

  const userListPanel = document.getElementById('userListPanel');
  document.getElementById('onlineToggleBtn').onclick = (e) => {
    e.stopPropagation();
    userListPanel.classList.toggle('hidden');
  };
  document.addEventListener('click', (e) => {
    if(!userListPanel.classList.contains('hidden') && !userListPanel.contains(e.target) && e.target.id !== 'onlineToggleBtn'){
      userListPanel.classList.add('hidden');
    }
  });

  async function postSystemMessage(text){
    try{
      const cur = await dbGet('rooms/'+roomCode+'/chat');
      const arr = cur || [];
      arr.push({ id:'sys-'+Date.now()+Math.random(), sys:true, text, ts: Date.now() });
      await dbSet('rooms/'+roomCode+'/chat', arr.slice(-100));
    }catch(e){}
  }

  // ---------- enter room ----------
  function enterRoom(){
    document.getElementById('landing').style.display = 'none';
    document.getElementById('room').style.display = 'flex';
    document.getElementById('roomCodeLabel').textContent = roomCode;
    document.getElementById('onlineLabel').textContent = '· 방 코드 ' + roomCode;
    startUsersWatch();
    const badge = document.getElementById('roleBadge');
    if(isHost){
      badge.textContent = 'HOST';
      badge.className = 'badge badge-host';
      document.getElementById('hostControls').classList.remove('hidden');
    } else {
      badge.textContent = 'VIEWER';
      badge.className = 'badge badge-viewer';
    }
    initPlayerWhenReady();
    startChatPolling();
    startReactionsWatch();
    startClosingWatch();
    setTimeout(()=>{
      if(!playerReady){
        document.getElementById('videoTitleLabel').textContent = '영상 로딩이 지연되고 있어요. 새로고침 후 다시 시도해보세요.';
      }
    }, 9000);
  }

  // ---------- YouTube player (postMessage 방식, 외부 iframe_api 스크립트 불필요) ----------
  let initialVideoId = null;
  let playerReadyHandled = false;
  let curTime = 0;
  let curDuration = 0;
  let curState = -1; // -1 unstarted, 1 playing, 2 paused

  function initPlayerWhenReady(){
    tryCreatePlayer();
  }

  let pendingVideoId = null;
  function tryCreatePlayer(){
    if(!roomCode || !initialVideoId || player) return;
    const container = document.getElementById('player');
    container.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.id = 'ytFrame';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    iframe.allowFullscreen = true;
    const origin = encodeURIComponent(window.location.origin || '*');
    iframe.src = 'https://www.youtube.com/embed/' + initialVideoId +
      '?enablejsapi=1&autoplay=1&mute=1&rel=0&playsinline=1&origin=' + origin;
    container.appendChild(iframe);
    player = iframe;
    pendingVideoId = initialVideoId;

    // YouTube 임베드에 "listening" 핸드셰이크를 반복 전송해서 상태 메시지를 받기 시작함
    let pings = 0;
    const pingTimer = setInterval(()=>{
      pings++;
      try{ iframe.contentWindow.postMessage(JSON.stringify({event:'listening', id:'syncwatch'}), '*'); }catch(e){}
      if(playerReadyHandled || pings > 15){ clearInterval(pingTimer); }
    }, 300);

    // 메시지 응답을 못 받는 환경이어도 재생 자체(autoplay)는 이미 진행 중이므로, 일정 시간 후엔 강제로 준비 처리
    setTimeout(()=>{ markPlayerReady(); }, 2000);
  }

  function ytPost(func, args){
    if(!player) return;
    try{ player.contentWindow.postMessage(JSON.stringify({event:'command', func, args: args||[]}), '*'); }catch(e){}
  }
  function ytPlay(){ ytPost('playVideo'); }
  function ytPause(){ ytPost('pauseVideo'); }
  function ytSeek(t){ ytPost('seekTo', [t, true]); }
  function ytLoad(vid){ ytPost('loadVideoById', [vid]); }

  window.addEventListener('message', function(e){
    if(typeof e.data !== 'string') return;
    let data;
    try{ data = JSON.parse(e.data); }catch(err){ return; }
    if(!data || !data.event) return;
    if(data.event === 'infoDelivery' && data.info){
      if(typeof data.info.currentTime === 'number') curTime = data.info.currentTime;
      if(typeof data.info.duration === 'number') curDuration = data.info.duration;
      if(typeof data.info.playerState === 'number'){
        const prev = curState;
        curState = data.info.playerState;
        if(!playerReadyHandled) markPlayerReady();
        if(isHost && !applyingRemoteState && prev !== curState && (curState === 1 || curState === 2)){
          broadcastState();
        }
      }
    } else if(data.event === 'onReady'){
      markPlayerReady();
    }
  });

  function markPlayerReady(){
    if(playerReadyHandled) return;
    playerReadyHandled = true;
    playerReady = true;
    isMuted = true;
    document.getElementById('unmuteBtn').classList.remove('hidden');
    if(isHost){
      ytPlay();
      setTimeout(broadcastState, 500);
    } else if(lastKnownState){
      const elapsed = (Date.now() - lastKnownState.updatedAt)/1000;
      const target = lastKnownState.time + (lastKnownState.isPlaying ? elapsed : 0);
      applyingRemoteState = true;
      ytSeek(target);
      if(lastKnownState.isPlaying) ytPlay(); else ytPause();
      setTimeout(()=>{ applyingRemoteState = false; }, 1000);
    }
    startStateSync();
    requestAnimationFrame(updateWaveline);
  }

  let isMuted = true;
  const unmuteBtn = document.getElementById('unmuteBtn');
  unmuteBtn.onclick = () => {
    ytPost('unMute');
    ytPost('setVolume', [100]);
    isMuted = false;
    unmuteBtn.classList.add('hidden');
  };

  function updateStatusLabel(){
    const label = document.getElementById('videoTitleLabel');
    if(!playerReadyHandled){ label.textContent = '영상을 불러오는 중...'; return; }
    switch(curState){
      case 1: label.textContent = (isMuted ? '재생 중(음소거) · ' : '재생 중 · ') + roomCode; break;
      case 2: label.textContent = '일시정지 · ' + roomCode; break;
      case 3: label.textContent = '버퍼링 중... · ' + roomCode; break;
      case 0: label.textContent = '재생 종료 · ' + roomCode; break;
      default: label.textContent = '영상 준비 중... · ' + roomCode;
    }
  }

  async function broadcastState(){
    if(!isHost || !playerReady) return;
    const st = {
      videoId: pendingVideoId,
      isPlaying: curState !== 2,
      time: curTime,
      updatedAt: Date.now()
    };
    lastKnownState = st;
    try{ await dbSet('rooms/'+roomCode+'/state', st); }catch(e){}
  }

  function startStateSync(){
    if(isHost){
      // 호스트는 자신의 재생 상태를 주기적으로 DB에 기록만 함
      if(stateInterval) clearInterval(stateInterval);
      stateInterval = setInterval(broadcastState, 2500);
    } else {
      // 뷰어는 DB 변경을 실시간으로 구독 (폴링 불필요)
      stateListenerRef = db.ref('rooms/'+roomCode+'/state');
      stateListenerRef.on('value', (snap)=>{
        const st = snap.val();
        if(!st) return;
        if(!lastKnownState || st.updatedAt !== lastKnownState.updatedAt){
          lastKnownState = st;
          if(st.videoId !== pendingVideoId){
            pendingVideoId = st.videoId;
            ytLoad(st.videoId);
          }
          const elapsed = (Date.now() - st.updatedAt)/1000;
          const target = st.time + (st.isPlaying ? elapsed : 0);
          const drift = Math.abs(curTime - target);
          applyingRemoteState = true;
          if(drift > 2.5) ytSeek(target);
          if(st.isPlaying) ytPlay(); else ytPause();
          setTimeout(()=>{ applyingRemoteState = false; }, 500);
        }
      });
    }
  }

  function updateWaveline(){
    updateStatusLabel();
    if(curDuration > 0){
      document.getElementById('waveFill').style.width = Math.min(100,(curTime/curDuration*100)) + '%';
    }
    requestAnimationFrame(updateWaveline);
  }

  // host: change video
  document.getElementById('changeVideoBtn').onclick = async () => {
    const url = document.getElementById('newVideoUrl').value.trim();
    const vid = extractVideoId(url);
    if(!vid) return;
    pendingVideoId = vid;
    ytLoad(vid);
    curTime = 0;
    document.getElementById('newVideoUrl').value = '';
    setTimeout(broadcastState, 800);
    await postSystemMessage('호스트가 영상을 변경했어요.');
  };
  document.getElementById('resyncBtn').onclick = async () => {
    await broadcastState();
    await postSystemMessage('호스트가 전체 동기화를 요청했어요.');
  };

  // ---------- chat ----------
  const chatLog = document.getElementById('chatLog');
  function renderMessage(m){
    if(lastChatIds.has(m.id)) return;
    lastChatIds.add(m.id);
    const div = document.createElement('div');
    if(m.sys){
      div.className = 'msg sys';
      div.textContent = m.text;
    } else {
      div.className = 'msg' + (m.nick === nickname ? ' me' : '');
      const who = document.createElement('div');
      who.className = 'who';
      who.style.color = m.nick === nickname ? 'var(--accent-a)' : colorFromName(m.nick);
      who.textContent = m.nick;
      const body = document.createElement('div');
      body.className = 'body-text';
      body.textContent = m.text;
      div.appendChild(who); div.appendChild(body);
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function colorFromName(name){
    const colors = ['#9b8cff','#7ef7e6','#ff9ec4','#ffd27e','#8fd0ff','#c1a3ff'];
    let h = 0;
    for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
    return colors[Math.abs(h) % colors.length];
  }

  function startChatPolling(){
    chatListenerRef = db.ref('rooms/'+roomCode+'/chat');
    chatListenerRef.on('value', (snap)=>{
      const arr = snap.val() || [];
      arr.forEach(renderMessage);
    });
  }

  async function sendMessage(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text || !roomCode) return;
    input.value = '';
    const msg = { id: nickname+'-'+Date.now()+'-'+Math.random(), nick: nickname, text, ts: Date.now() };
    renderMessage(msg);
    try{
      const cur = await dbGet('rooms/'+roomCode+'/chat');
      const arr = cur || [];
      arr.push(msg);
      await dbSet('rooms/'+roomCode+'/chat', arr.slice(-150));
    }catch(e){}
  }

  document.getElementById('sendBtn').onclick = sendMessage;
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') sendMessage();
  });

  document.getElementById('leaveBtn').onclick = () => {
    if(stateInterval) clearInterval(stateInterval);
    if(chatInterval) clearInterval(chatInterval);
    if(stateListenerRef) stateListenerRef.off();
    if(chatListenerRef) chatListenerRef.off();
    if(usersListenerRef) usersListenerRef.off();
    if(reactionsListenerRef) reactionsListenerRef.off();
    if(closingListenerRef) closingListenerRef.off();
    if(closingTimer) clearTimeout(closingTimer);
    if(roomCode && myUserKey){ try{ db.ref('rooms/'+roomCode+'/users/'+myUserKey).remove(); }catch(e){} }
    location.reload();
  };

  // ---------- emoji reactions ----------
  let reactionsListenerRef = null;
  let lastReactionIds = new Set();
  let reactionsStartedAt = Date.now();
  let reactionsEnabled = localStorage.getItem('reactionsEnabled') !== 'off';

  const reactionBar = document.getElementById('reactionBar');
  const reactionCollapseBtn = document.getElementById('reactionCollapseBtn');
  let reactionBarCollapsed = localStorage.getItem('reactionBarCollapsed') !== '0'; // 기본값: 접힌 상태
  function syncReactionBarCollapse(){
    reactionBar.classList.toggle('collapsed', reactionBarCollapsed);
  }
  syncReactionBarCollapse();
  reactionCollapseBtn.onclick = () => {
    reactionBarCollapsed = !reactionBarCollapsed;
    localStorage.setItem('reactionBarCollapsed', reactionBarCollapsed ? '1' : '0');
    syncReactionBarCollapse();
  };

  const reactionToggleBtn = document.getElementById('reactionToggleBtn');
  function syncReactionToggleBtn(){
    reactionToggleBtn.textContent = reactionsEnabled ? '👁️' : '🙈';
    reactionToggleBtn.classList.toggle('muted', !reactionsEnabled);
    reactionToggleBtn.title = reactionsEnabled ? '리액션 표시 끄기' : '리액션 표시 켜기';
  }
  syncReactionToggleBtn();
  reactionToggleBtn.onclick = () => {
    reactionsEnabled = !reactionsEnabled;
    localStorage.setItem('reactionsEnabled', reactionsEnabled ? 'on' : 'off');
    syncReactionToggleBtn();
  };

  document.querySelectorAll('.reaction-bar [data-emoji]').forEach(btn=>{
    btn.onclick = () => sendReaction(btn.getAttribute('data-emoji'));
  });

  async function sendReaction(emoji){
    if(!roomCode) return;
    const item = { id: nickname+'-'+Date.now()+'-'+Math.random(), nick: nickname, emoji, ts: Date.now() };
    // 내 화면에는 서버 왕복 없이 바로 살짝 띄워줌
    spawnReactionEmoji(emoji);
    try{
      const cur = await dbGet('rooms/'+roomCode+'/reactions');
      const arr = cur || [];
      arr.push(item);
      await dbSet('rooms/'+roomCode+'/reactions', arr.slice(-40));
    }catch(e){}
  }

  function spawnReactionEmoji(emoji){
    if(!reactionsEnabled) return;
    const overlay = document.getElementById('reactionOverlay');
    const span = document.createElement('span');
    span.className = 'reaction-emoji';
    span.textContent = emoji;
    const leftPct = 8 + Math.random()*84;
    span.style.left = leftPct + '%';
    span.style.setProperty('--drift', (Math.random()*40 - 20) + 'px');
    overlay.appendChild(span);
    setTimeout(()=>{ span.remove(); }, 2700);
  }

  function startReactionsWatch(){
    reactionsListenerRef = db.ref('rooms/'+roomCode+'/reactions');
    reactionsListenerRef.on('value', (snap)=>{
      const arr = snap.val() || [];
      arr.forEach(r=>{
        if(lastReactionIds.has(r.id)) return;
        lastReactionIds.add(r.id);
        // 접속 직후 과거 리액션들이 한꺼번에 몰려서 뜨는 걸 방지 (최근 것만 애니메이션)
        if(r.ts >= reactionsStartedAt - 1500 && r.nick !== nickname){
          spawnReactionEmoji(r.emoji);
        }
      });
    });
  }

  // ---------- host: end room (방 종료) ----------
  let closingListenerRef = null;
  let closingTimer = null;
  let closingCountdownInterval = null;
  const endRoomBtn = document.getElementById('endRoomBtn');
  if(endRoomBtn){
    endRoomBtn.onclick = async () => {
      if(!isHost || !roomCode) return;
      const ok = confirm('정말 방을 종료할까요?\n30초 후 모든 참여자의 화면이 함께 종료돼요.');
      if(!ok) return;
      endRoomBtn.disabled = true;
      endRoomBtn.textContent = '종료 처리 중...';
      const closesAt = Date.now() + 30000;
      try{
        await postSystemMessage('⏳ 30초 후 [' + roomCode + '] 관람 방이 종료됩니다.');
        await dbSet('rooms/'+roomCode+'/closing', { by: nickname, closesAt });
      }catch(e){}
    };
  }

  function startClosingWatch(){
    closingListenerRef = db.ref('rooms/'+roomCode+'/closing');
    closingListenerRef.on('value', (snap)=>{
      const val = snap.val();
      if(!val || !val.closesAt) return;
      scheduleRoomClose(val.closesAt);
    });
  }

  let closeScheduled = false;
  function scheduleRoomClose(closesAt){
    if(closeScheduled) return;
    closeScheduled = true;
    const remain = Math.max(0, closesAt - Date.now());
    showClosingCountdown(Math.ceil(remain/1000));
    closingTimer = setTimeout(closeRoomNow, remain);
  }

  function showClosingCountdown(seconds){
    const overlay = document.getElementById('closingOverlay');
    const countEl = document.getElementById('closingCount');
    document.getElementById('closingDesc').textContent = '[' + roomCode + '] 관람 방이 곧 종료됩니다.';
    let remaining = seconds;
    countEl.textContent = remaining;
    overlay.classList.add('show');
    if(closingCountdownInterval) clearInterval(closingCountdownInterval);
    closingCountdownInterval = setInterval(()=>{
      remaining -= 1;
      countEl.textContent = Math.max(0, remaining);
      if(remaining <= 0) clearInterval(closingCountdownInterval);
    }, 1000);
  }

  function closeRoomNow(){
    if(closingCountdownInterval) clearInterval(closingCountdownInterval);
    if(stateInterval) clearInterval(stateInterval);
    if(chatInterval) clearInterval(chatInterval);
    if(stateListenerRef) stateListenerRef.off();
    if(chatListenerRef) chatListenerRef.off();
    if(usersListenerRef) usersListenerRef.off();
    if(reactionsListenerRef) reactionsListenerRef.off();
    if(closingListenerRef) closingListenerRef.off();

    document.getElementById('closingTitle').textContent = '방이 종료됐어요';
    document.getElementById('closingDesc').textContent = '[' + roomCode + '] 관람 방이 종료되었습니다.';
    document.getElementById('closingCount').textContent = '👋';
    document.getElementById('closingOverlay').classList.add('show');

    if(roomCode && myUserKey){ try{ db.ref('rooms/'+roomCode+'/users/'+myUserKey).remove(); }catch(e){} }
    // 호스트가 방 데이터 자체를 완전히 폭파(삭제)
    if(isHost && roomCode){ try{ db.ref('rooms/'+roomCode).remove(); }catch(e){} }

    setTimeout(()=>{ location.reload(); }, 2500);
  }

  // ---------- fullscreen split view (영상 + 채팅을 함께 전체화면으로) ----------
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const mainEl = document.querySelector('main');
  function isFullscreenActive(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  fullscreenBtn.onclick = () => {
    if(!isFullscreenActive()){
      const req = mainEl.requestFullscreen || mainEl.webkitRequestFullscreen;
      if(req) req.call(mainEl);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  };
  function syncFullscreenBtnLabel(){
    fullscreenBtn.textContent = isFullscreenActive() ? '⤡ 전체화면 종료' : '⛶ 전체화면';
  }
  document.addEventListener('fullscreenchange', syncFullscreenBtnLabel);
  document.addEventListener('webkitfullscreenchange', syncFullscreenBtnLabel);

  // if YT API already loaded before script ran
  // (postMessage 방식으로 전환하면서 별도 API 로딩 대기 불필요)
})();
</script>
</body>
</html>
